version: "3.9"

services:
  api:
    build:
      context: .
    container_name: accounting_backend
    command: bash -c "python manage.py migrate && python manage.py runserver_plus --cert-file /app/certs/localhost.pem --key-file /app/certs/localhost-key.pem 0.0.0.0:8000"
    volumes:
      - .:/app
      - /app/certs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=accountingfront.settings
    develop:
      watch:
        - path: ./backend
          target: /app
          action: sync

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: rootpassword123
    env_file:
      - .env
    ports:
      - "3308:3306"   # host 3308 -> container 3306
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
