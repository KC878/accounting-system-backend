version: "3.9"

services:
  api:
    build:
      context: .
    container_name: accounting_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=accountingfront.settings
    develop:
      watch:
        - path: ./backend
          target: /app
          action: sync

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: rootpassword123
    env_file:
      - .env
    ports:
      - "3308:3306"   # host 3308 -> container 3306
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
